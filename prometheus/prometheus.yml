global:
  scrape_interval: 60s
  evaluation_interval: 60s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: gateway-sandbox
    static_configs:
      - targets: ["gwmon-exporter:9105"]
        labels:
          env: sandbox

  - job_name: gateway-validation
    static_configs:
      - targets: ["gwmon-validator:9106"]
        labels:
          env: sandbox

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
